name: Build iOS IPA & macOS App & Create Release (BookParadise)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Опубликовать GitHub Release?'
        required: false
        type: boolean
        default: false
      version_tag:
        description: 'Тег версии (например, v2.0.0)'
        required: false
        type: string
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-apps:
    name: Build iOS (IPA) & macOS (App)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Find Xcode Project
        id: find-project
        run: |
          PROJ_PATH=$(find . -name "BookParadise.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "Error: BookParadise.xcodeproj not found!"
            exit 1
          fi
          echo "project_path=$PROJ_PATH" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJ_PATH"

      - name: Determine Build Version
        id: get-version
        run: |
          VERSION="2.0.0"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${RAW_TAG#v}"
          elif [ -n "${{ github.event.inputs.version_tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.version_tag }}"
            VERSION="${RAW_TAG#v}"
          fi
          
          IS_PRERELEASE="false"
          if [[ "$VERSION" =~ (alpha|beta|rc|dev) ]]; then
            IS_PRERELEASE="true"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Target BookParadise Version: $VERSION (Pre-release: $IS_PRERELEASE)"

      # --- 1. СБОРКА ДЛЯ IOS (IPHONE & IPAD) ---
      - name: Build iOS App (Release)
        run: |
          xcodebuild build \
            -project "${{ steps.find-project.outputs.project_path }}" \
            -scheme BookParadise \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${{ github.workspace }}/build-ios"

      - name: Package .app into .ipa for iOS
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          mkdir -p Payload
          APP_PATH=$(find build-ios -name "BookParadise.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: BookParadise.app not found in build-ios!"
            exit 1
          fi
          echo "Found iOS app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r "BookParadise-${VERSION}.ipa" Payload
          rm -rf Payload

      # --- 2. СБОРКА ДЛЯ MACOS (APPLE SILICON & INTEL) ---
      - name: Build macOS App (Mac Catalyst Release)
        run: |
          xcodebuild build \
            -project "${{ steps.find-project.outputs.project_path }}" \
            -scheme BookParadise \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${{ github.workspace }}/build-mac"

      - name: Package macOS App into .dmg and .pkg
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          MAC_APP_PATH=$(find build-mac -name "BookParadise.app" -type d | head -n 1)
          if [ -z "$MAC_APP_PATH" ]; then
            echo "Error: BookParadise.app not found in build-mac!"
            exit 1
          fi
          echo "Found macOS app at: $MAC_APP_PATH"

          # 1. Образ диска DMG (Drag-and-Drop в /Applications)
          mkdir -p dmg_folder
          cp -R "$MAC_APP_PATH" dmg_folder/
          ln -s /Applications dmg_folder/Applications
          hdiutil create -volname "BookParadise" -srcfolder dmg_folder -ov -format UDZO "BookParadise-${VERSION}.dmg"
          rm -rf dmg_folder

          # 2. Инсталлятор PKG (установка в /Applications)
          pkgbuild --component "$MAC_APP_PATH" --install-location /Applications "BookParadise-${VERSION}.pkg"

      # --- 3. АРТИФАКТЫ И РЕЛИЗЫ ---
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookParadise-${{ steps.get-version.outputs.version }}-iOS-IPA
          path: BookParadise-*.ipa
          retention-days: 14

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookParadise-${{ steps.get-version.outputs.version }}-macOS-DMG
          path: BookParadise-*.dmg
          retention-days: 14

      - name: Upload macOS PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookParadise-${{ steps.get-version.outputs.version }}-macOS-PKG
          path: BookParadise-*.pkg
          retention-days: 14

      - name: Create or Update GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BookParadise-${{ steps.get-version.outputs.version }}.ipa
            BookParadise-${{ steps.get-version.outputs.version }}.dmg
            BookParadise-${{ steps.get-version.outputs.version }}.pkg
          name: "Книжный Рай ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ steps.get-version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (manual workflow dispatch)
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BookParadise-${{ steps.get-version.outputs.version }}.ipa
            BookParadise-${{ steps.get-version.outputs.version }}.dmg
            BookParadise-${{ steps.get-version.outputs.version }}.pkg
          tag_name: ${{ github.event.inputs.version_tag }}
          name: "Книжный Рай ${{ github.event.inputs.version_tag }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ steps.get-version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
