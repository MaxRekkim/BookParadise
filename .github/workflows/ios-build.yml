name: Build & Release BookParadise (iOS, macOS, Android, Windows)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Опубликовать GitHub Release?'
        required: false
        type: boolean
        default: false
      version_tag:
        description: 'Тег версии (например, v2.5.0)'
        required: false
        type: string
        default: 'v2.5.0'

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. APPLE BUILDS (iOS IPA + macOS DMG & PKG)
  # ============================================================================
  build-apple:
    name: Build iOS (IPA) & macOS (DMG/PKG)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Find Xcode Project
        id: find-project
        run: |
          PROJ_PATH=$(find . -name "BookParadise.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "Error: BookParadise.xcodeproj not found!"
            exit 1
          fi
          echo "project_path=$PROJ_PATH" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJ_PATH"

      - name: Determine Build Version
        id: get-version
        run: |
          VERSION="2.5.0"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${RAW_TAG#v}"
          elif [ -n "${{ github.event.inputs.version_tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.version_tag }}"
            VERSION="${RAW_TAG#v}"
          elif [ -f "${{ steps.find-project.outputs.project_path }}/project.pbxproj" ]; then
            PARSED_VER=$(grep -m1 "MARKETING_VERSION" "${{ steps.find-project.outputs.project_path }}/project.pbxproj" | awk '{print $3}' | tr -d ';')
            if [ -n "$PARSED_VER" ]; then
              VERSION="$PARSED_VER"
            fi
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Target BookParadise Version: $VERSION"

      # --- IOS (IPHONE & IPAD) ---
      - name: Build iOS App (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${{ steps.find-project.outputs.project_path }}" \
            -scheme BookParadise \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${{ github.workspace }}/build-ios" 2>&1 | tee xcode-ios.log

      - name: Report iOS Build Failure
        if: failure()
        run: |
          echo "::error::iOS Build Failed:"
          grep -E "error:|fatal error:" xcode-ios.log | head -n 25 | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      - name: Package .app into .ipa for iOS
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          mkdir -p Payload
          APP_PATH=$(find build-ios -name "BookParadise.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: BookParadise.app not found in build-ios!"
            exit 1
          fi
          echo "Found iOS app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r "BookParadise-${VERSION}.ipa" Payload
          rm -rf Payload

      # --- MACOS (CATALYST DMG & PKG) ---
      - name: Build macOS App (Mac Catalyst Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${{ steps.find-project.outputs.project_path }}" \
            -scheme BookParadise \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${{ github.workspace }}/build-mac" 2>&1 | tee xcode-mac.log

      - name: Report macOS Build Failure
        if: failure()
        run: |
          echo "::error::macOS Build Failed:"
          grep -E "error:|fatal error:" xcode-mac.log | head -n 25 | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      - name: Package macOS App into .dmg and .pkg
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          MAC_APP_PATH=$(find build-mac -name "BookParadise.app" -type d | head -n 1)
          if [ -z "$MAC_APP_PATH" ]; then
            echo "Error: BookParadise.app not found in build-mac!"
            exit 1
          fi
          echo "Found macOS app at: $MAC_APP_PATH"

          # 1. Образ диска DMG
          mkdir -p dmg_folder
          cp -R "$MAC_APP_PATH" dmg_folder/
          ln -s /Applications dmg_folder/Applications
          hdiutil create -volname "BookParadise" -srcfolder dmg_folder -ov -format UDZO "BookParadise-${VERSION}.dmg"
          rm -rf dmg_folder

          # 2. Инсталлятор PKG
          pkgbuild --component "$MAC_APP_PATH" --install-location /Applications "BookParadise-${VERSION}.pkg"

      # --- ARTIFACTS ---
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookParadise-${{ steps.get-version.outputs.version }}-iOS-IPA
          path: BookParadise-*.ipa
          retention-days: 14

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookParadise-${{ steps.get-version.outputs.version }}-macOS-DMG
          path: BookParadise-*.dmg
          retention-days: 14

      - name: Upload macOS PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookParadise-${{ steps.get-version.outputs.version }}-macOS-PKG
          path: BookParadise-*.pkg
          retention-days: 14

  # ============================================================================
  # 2. ANDROID BUILD (APK)
  # ============================================================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Build Version
        id: get-version
        run: |
          VERSION="2.5.0"
          BUILD_NUMBER="10"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${RAW_TAG#v}"
          elif [ -n "${{ github.event.inputs.version_tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.version_tag }}"
            VERSION="${RAW_TAG#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Android target version: $VERSION ($BUILD_NUMBER)"

      - name: Prepare and Build Android APK
        working-directory: BookParadise_Multiplatform
        run: |
          set -o pipefail
          rm -rf android
          flutter create --platforms=android --org com.maxim --project-name book_paradise .
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r', encoding='utf-8') as f:
              c = f.read()
          c = c.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application', 1)
          c = c.replace('android:label=\"book_paradise\"', 'android:label=\"Книжный Рай\"', 1)
          with open(p, 'w', encoding='utf-8') as f:
              f.write(c)
          "
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation --build-name=${{ steps.get-version.outputs.version }} --build-number=${{ steps.get-version.outputs.build_number }} 2>&1 | tee ../android-build.log || \
          (echo 'Retrying build once...' && sleep 10 && flutter build apk --release --android-skip-build-dependency-validation --build-name=${{ steps.get-version.outputs.version }} --build-number=${{ steps.get-version.outputs.build_number }} 2>&1 | tee ../android-build.log)
          
          # Copy APK with clear release filename
          APK_SRC=$(find build -name "*release*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          cp "$APK_SRC" ../BookParadise-${{ steps.get-version.outputs.version }}-Android.apk

      - name: Report Android Build Failure
        if: failure()
        run: |
          python3 -c "
          import os
          for p in ['android-build.log', '../android-build.log', 'BookParadise_Multiplatform/android-build.log']:
              if os.path.exists(p):
                  with open(p, 'r', errors='replace') as f:
                      lines = [l.rstrip() for l in f.readlines() if l.strip()]
                  for line in lines[-35:]:
                      clean = line.replace('%', ' ').replace('\r', '')
                      print(f'::error title=Android::{clean}')
                  break
          "
          echo "### Android Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 50 android-build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Android Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookParadise-${{ steps.get-version.outputs.version }}-Android-APK
          path: BookParadise-*-Android.apk
          retention-days: 14

  # ============================================================================
  # 3. WINDOWS BUILD (Portable x64 ZIP)
  # ============================================================================
  build-windows:
    name: Build Windows (Portable x64 ZIP)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Build Version
        id: get-version
        shell: bash
        run: |
          VERSION="2.5.0"
          BUILD_NUMBER="10"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${RAW_TAG#v}"
          elif [ -n "${{ github.event.inputs.version_tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.version_tag }}"
            VERSION="${RAW_TAG#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Windows target version: $VERSION ($BUILD_NUMBER)"

      - name: Prepare and Build Windows Desktop App
        shell: bash
        working-directory: BookParadise_Multiplatform
        run: |
          set -o pipefail
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org com.maxim --project-name book_paradise .
          flutter pub get
          flutter build windows --release --build-name=${{ steps.get-version.outputs.version }} --build-number=${{ steps.get-version.outputs.build_number }} 2>&1 | tee ../windows-build.log

      - name: Report Windows Build Failure
        if: failure()
        shell: bash
        run: |
          python3 -c "
          import os
          for p in ['windows-build.log', '../windows-build.log', 'BookParadise_Multiplatform/windows-build.log']:
              if os.path.exists(p):
                  with open(p, 'r', errors='replace') as f:
                      lines = f.readlines()
                  errs = [l.strip() for l in lines if any(k in l.lower() for k in ['error', 'failure', 'exception', 'fatal'])]
                  tail = errs[-20:] if errs else [l.strip() for l in lines[-25:] if l.strip()]
                  msg = '%0A'.join(tail).replace('%', '%25').replace('\r', '')
                  print(f'::error title=Windows Build Error::{msg}')
                  break
          "
          echo "### Windows Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 50 windows-build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Windows Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: windows-build.log

      - name: Package Windows ZIP
        shell: bash
        run: |
          python3 -c "
          import os, sys, zipfile

          ver = sys.argv[1]
          release_dir = None
          for root, dirs, files in os.walk('BookParadise_Multiplatform/build/windows'):
              if os.path.basename(root).lower() == 'release':
                  if any(f.endswith('.exe') for f in files):
                      release_dir = root
                      break
                  elif not release_dir:
                      release_dir = root

          if not release_dir:
              print('ERROR: Windows release directory not found!')
              sys.exit(1)

          print(f'Found release directory: {release_dir}')
          zip_name = f'BookParadise-{ver}-Windows-x64.zip'
          with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk(release_dir):
                  for file in files:
                      p = os.path.join(root, file)
                      arcname = os.path.relpath(p, release_dir)
                      zf.write(p, arcname)

          size_mb = os.path.getsize(zip_name) / (1024 * 1024)
          print(f'Successfully created {zip_name} ({size_mb:.2f} MB)')
          " "${{ steps.get-version.outputs.version }}"
          ls -lh BookParadise-*-Windows-x64.zip

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookParadise-${{ steps.get-version.outputs.version }}-Windows-ZIP
          path: BookParadise-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  # ============================================================================
  # 4. PUBLISH MULTIPLATFORM GITHUB RELEASE
  # ============================================================================
  publish-release:
    name: Publish Multiplatform GitHub Release
    runs-on: ubuntu-latest
    needs: [build-apple, build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag & Version
        id: release-info
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -n "${{ github.event.inputs.version_tag }}" ] && [ "${{ github.event.inputs.create_release }}" == "true" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          fi
          VERSION="${TAG#v}"
          
          IS_PRERELEASE="false"
          if [[ "$VERSION" =~ (alpha|beta|rc|dev) ]]; then
            IS_PRERELEASE="true"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Inspect Release Artifacts
        run: |
          echo "=== Artifacts to be published ==="
          ls -lh dist-release/

      - name: Update manifest.plist for Apple OTA
        run: |
          VERSION="${{ steps.release-info.outputs.version }}"
          python3 -c "
          import plistlib
          p = 'manifest.plist'
          with open(p, 'rb') as f:
              pl = plistlib.load(f)
          pl['items'][0]['assets'][0]['url'] = f'https://github.com/MaxRekkim/BookParadise/releases/latest/download/BookParadise-{VERSION}.ipa'
          pl['items'][0]['metadata']['bundle-version'] = str(VERSION)
          with open(p, 'wb') as f:
              plistlib.dump(pl, f)
          "
          echo "Generated manifest.plist for v$VERSION:"
          cat manifest.plist

      - name: Publish GitHub Release with all 4 platforms
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.tag }}
          name: "Книжный Рай ${{ steps.release-info.outputs.tag }} (iOS, macOS, Android, Windows)"
          body_path: CHANGELOG.md
          files: |
            dist-release/BookParadise-*.ipa
            dist-release/BookParadise-*.dmg
            dist-release/BookParadise-*.pkg
            dist-release/BookParadise-*-Android.apk
            dist-release/BookParadise-*-Windows-x64.zip
            manifest.plist
          draft: false
          prerelease: ${{ steps.release-info.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
