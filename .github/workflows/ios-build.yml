name: Build iOS IPA & Create Release (BookParadise)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Опубликовать GitHub Release?'
        required: false
        type: boolean
        default: false
      version_tag:
        description: 'Тег версии (например, v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned IPA for Sideloading
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Find Xcode Project
        id: find-project
        run: |
          PROJ_PATH=$(find . -name "BookParadise.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "Error: BookParadise.xcodeproj not found!"
            exit 1
          fi
          echo "project_path=$PROJ_PATH" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJ_PATH"

      - name: Build Archive (No Code Signing Required)
        run: |
          xcodebuild build \
            -project "${{ steps.find-project.outputs.project_path }}" \
            -scheme BookParadise \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${{ github.workspace }}/build"

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          # Ищем скомпилированное приложение BookParadise.app во всем репозитории
          APP_PATH=$(find . -name "BookParadise.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: BookParadise.app not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r BookParadise.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookParadise-iOS
          path: BookParadise.ipa
          retention-days: 14

      - name: Create or Update GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BookParadise.ipa
          name: "✨ Книжный Рай ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (manual workflow dispatch)
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: BookParadise.ipa
          tag_name: ${{ github.event.inputs.version_tag }}
          name: "✨ Книжный Рай ${{ github.event.inputs.version_tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
